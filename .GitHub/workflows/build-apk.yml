name: Build Onyx Movies APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter 3.16.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi
      
      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk Onyx-Movies-v1.0.0-arm64.apk
          mv app-armeabi-v7a-release.apk Onyx-Movies-v1.0.0-arm32.apk
          mv app-x86_64-release.apk Onyx-Movies-v1.0.0-x86_64.apk
      
      - name: Upload APKs to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: Onyx Movies v1.0.0 Build ${{ github.run_number }}
          body: |
            🎬 Onyx Movies - iOS 26 Liquid Glass Premium
            
            ✅ Auto Update Enabled
            ✅ Download to Movies/Onyx Movies
            ✅ Gallery Save Enabled
            ✅ Firebase Movies
            
            Download the APK for your device:
            - arm64: Most new phones (2020+)
            - arm32: Older phones
            - x86_64: Emulators
            
            Admin Panel: https://your-project.web.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-movies-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
