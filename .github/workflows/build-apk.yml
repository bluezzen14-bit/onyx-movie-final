name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Fix Android Gradle - Keep your main.dart safe
        run: |
          sed -i 's/onyx-movie-final/onyx_movie_final/g' pubspec.yaml
          cat pubspec.yaml
          cp lib/main.dart /tmp/main.dart.bak
          rm -rf android
          flutter create . --platforms=android --project-name onyx_movie_final --org com.onyx.movies
          mv /tmp/main.dart.bak lib/main.dart
          flutter clean
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload ONYX APK
        uses: actions/upload-artifact@v4
        with:
          name: onyx_movie_final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
