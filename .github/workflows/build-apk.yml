name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Fix Gradle - Keep android
        run: |
          echo "Keeping android folder..."
          chmod +x android/gradlew || true
          ls android/app/ | grep google || echo "WARNING: google-services.json missing!"

      - name: Clean WhatsApp chars
        run: |
          sed -i 's/\xE2\x80\x8E//g; s/\xE2\x80\x8B//g; s/\xE2\x80\xAA//g; s/\xE2\x80\xAC//g; s/\xE2\x80\xAB//g; s/\r//g' lib/main.dart || true
          sed -i 's/•/*/g; s/–/-/g; s/—/-/g' lib/main.dart || true

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: onyx_movie_final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
