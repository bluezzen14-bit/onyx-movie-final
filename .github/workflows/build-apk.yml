name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fix Gradle - Recreate with backup
        run: |
          echo "Backing up google-services.json..."
          cp android/app/google-services.json /tmp/google-services.json || echo "No google file found"
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          
          echo "Deleting broken android folder..."
          rm -rf android
          
          echo "Recreating android project..."
          flutter create . --platforms=android --project-name onyx_movies
          
          echo "Restoring google-services.json..."
          cp /tmp/google-services.json android/app/google-services.json || echo "WARNING: google-services.json not found - add it to android/app/"
          
          echo "Fixing gradlew permission..."
          chmod +x android/gradlew

      - name: Clean WhatsApp chars
        run: |
          sed -i 's/\xE2\x80\x8E//g; s/\xE2\x80\x8B//g; s/\xE2\x80\xAA//g; s/\xE2\x80\xAC//g; s/\xE2\x80\xAB//g; s/\r//g' lib/main.dart || true

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: onyx_movie_final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
