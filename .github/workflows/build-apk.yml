name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.22.3 - No SDK 35 Error
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Fix Unsupported Gradle Project
        run: |
          echo "Backing up google-services.json"
          cp android/app/google-services.json /tmp/g.json 2>/dev/null || echo "No google-services.json to backup"
          echo "Removing old android folder"
          rm -rf android
          echo "Creating new android folder"
          flutter create . --platforms=android --project-name onyx_movies --org com.onyxmovies
          echo "Restoring google-services.json"
          cp /tmp/g.json android/app/google-services.json 2>/dev/null || echo "No backup to restore"
          chmod +x android/gradlew
          echo "Fixed!"

      - name: Get packages
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onyx-movies-apk-fixed
          path: build/app/outputs/flutter-apk/app-release.apk
