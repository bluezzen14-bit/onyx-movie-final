name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Fix Gradle - Don't delete android
        run: |
          echo "Fixing gradle without deleting android folder..."
          # Keep android/ - only fix wrapper
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name onyx_movie_final
          else
            echo "android folder exists - keeping google-services.json"
          fi
          # Fix gradlew permission
          chmod +x android/gradlew || true
          # Fix gradle wrapper if broken
          cd android
          ./gradlew wrapper --gradle-version 8.5 || true
          cd ..

      - name: Fix pubspec conflict - Force compatible versions
        run: |
          echo "Fixing file_picker + share_plus conflict..."
          # Auto-fix pubspec if old versions
          sed -i 's/file_picker: \^8.1.2/file_picker: ^8.3.7/g' pubspec.yaml || true
          sed -i 's/file_picker: \^8.1.0/file_picker: ^8.3.7/g' pubspec.yaml || true
          sed -i 's/share_plus: \^8.0.2/share_plus: ^10.1.4/g' pubspec.yaml || true
          sed -i 's/share_plus: \^8.0.1/share_plus: ^10.1.4/g' pubspec.yaml || true
          cat pubspec.yaml | grep -E "file_picker|share_plus"

      - name: Fix invisible WhatsApp chars - Auto clean
        run: |
          echo "Cleaning lib/main.dart from WhatsApp invisible chars..."
          sed -i 's/\xE2\x80\x8E//g; s/\xE2\x80\x8B//g; s/\xE2\x80\xAA//g; s/\xE2\x80\xAC//g; s/\xE2\x80\xAB//g; s/\r//g' lib/main.dart || true
          sed -i 's/•/*/g; s/–/-/g; s/—/-/g' lib/main.dart || true
          echo "Cleaned file size: $(wc -c < lib/main.dart) bytes"
          head -5 lib/main.dart

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: onyx_movie_final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
