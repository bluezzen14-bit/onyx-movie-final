name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Fix Gradle - SDK 35
        run: |
          cp android/app/google-services.json /tmp/gs.json || true
          rm -rf android
          flutter create . --platforms=android --project-name onyx_movies
          cp /tmp/gs.json android/app/google-services.json || true
          chmod +x android/gradlew
          # FORCE SDK 35 - This fixes your Image 1 error
          echo "Applying SDK 35 fix..."
          FILE="android/app/build.gradle"
          # For new Flutter template (flutter.compileSdkVersion)
          sed -i 's/compileSdkVersion.*/compileSdk 35/g' $FILE || true
          sed -i 's/compileSdk.*/compileSdk 35/g' $FILE || true
          sed -i 's/targetSdk.*/targetSdk 35/g' $FILE || true
          # Inject directly if not found
          if ! grep -q "compileSdk 35" $FILE; then
            sed -i '/android {/a \    compileSdk 35' $FILE
          fi
          cat $FILE | grep -A2 -B2 "compileSdk\|targetSdk"

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: onyx_movie_final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
