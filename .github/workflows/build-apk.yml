name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Fix Android Folder with Perfect Name
        run: |
          if [ ! -f "lib/main.dart" ]; then echo "ERROR lib/main.dart missing"; exit 1; fi
          rm -rf android
          flutter create . --platforms=android --project-name onyx_movie_final --org com.onyx.movies --overwrite
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload ONYX APK
        uses: actions/upload-artifact@v4
        with:
          name: onyx_movie_final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
