name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Fix Android Gradle - Keep your main.dart safe
        run: |
          echo "=== Checking project ==="
          cat pubspec.yaml
          echo "---"
          ls -la lib/ || mkdir -p lib
          
          if [ ! -f lib/main.dart ]; then
            echo "ERROR: lib/main.dart NOT FOUND!"
            echo "Go to GitHub -> Create file lib/main.dart -> Paste your code"
            exit 1
          fi

          sed -i 's/onyx-movie-final/onyx_movie_final/g' pubspec.yaml || true
          sed -i 's/onyx-movie-final/onyx_movie_final/g' pubspec.lock || true

          cp lib/main.dart /tmp/main.dart.bak
          echo "main.dart backed up OK"

          if [ ! -d android ]; then
            echo "android folder missing -> recreating"
            rm -rf android
            flutter create . --platforms=android --project-name onyx_movie_final --org com.onyx.movies
            cp /tmp/main.dart.bak lib/main.dart
          else
            echo "android folder OK -> keeping it"
          fi

          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload ONYX APK
        uses: actions/upload-artifact@v4
        with:
          name: onyx_movie_final-apk
          path: build/app/outputs/flutter-apk/app-release.apk
