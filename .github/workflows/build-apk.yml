name: Onyx Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix Android folder
        run: |
          sed -i 's/onyx-movie-final/onyx_movie_final/g' pubspec.yaml
          sed -i 's/onyx_movie_final/onyx_movie_final/g' pubspec.yaml
          cp lib/main.dart /tmp/main.dart || echo "no main"
          rm -rf android
          flutter create --project-name onyx_movie_final --platforms=android .
          cp /tmp/main.dart lib/main.dart || true

      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-apk
          path: build/app/outputs/flutter-apk/app-release.apk
