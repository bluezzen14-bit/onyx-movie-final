name: onyx_movies
description: Onyx Movies - iOS 26 Liquid Glass Premium Movies & Series
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI - iOS 26 Liquid Glass
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # Firebase - Core for User Panel + Admin Panel
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.0
  
  # Video Player - For Player Screen
  video_player: ^2.8.1
  chewie: ^1.7.5
  
  # Download Service - Save to Movies/Onyx Movies + Gallery
  dio: ^5.4.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  device_info_plus: ^9.1.2
  gal: ^2.3.0
  image_gallery_saver: ^2.0.3
  flutter_local_notifications: ^16.3.2
  open_file: ^3.3.2
  path: ^1.8.3
  
  # Auto Update Service
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#000000"
    theme_color: "#2196F3"

flutter:
  uses-material-design: true
  assets:
    - assets/
