name: onyx_movies
description: ONYX MOVIES - Fixed auto-login permanent + Firebase internet sync + Browser update
publish_to: 'none'
version: 1.0.7+15

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.24.2
  firebase_database: ^10.4.5
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  url_launcher: ^6.2.2
  http: ^1.1.2
  path_provider: ^2.1.2
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
